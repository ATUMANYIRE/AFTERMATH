# ==============================================================================
# GitLab Duo Flow Registry v1 Specification: Remediation Engineer Flow
# Project: atumanyire-labs/aftermath
# ==============================================================================
version: "1.0"

metadata:
  name: "aftermath-remediation-engineer"
  displayName: "GitLab Duo Remediation Engineer"
  description: "Autonomous code remediation flow that synthesizes atomic idempotency barriers, executes worktree verification, and prepares merge requests."
  version: "1.2.0"

environment:
  coding_environment: full

triggers:
  - type: custom.aftermath_consequence_audit.invariant_failed
  - type: mention
  - type: assign

components:
  - name: "synthesize_patch"
    type: AgentComponent
    prompt_id: "remediation_synthesis_prompt"
    inputs:
      - from: "context:release_id"
        as: "release_id"
      - from: "context:violated_invariant"
        as: "violated_invariant"

  - name: "validate_patch_sandbox"
    type: ToolComponent
    tool: "aftermath_sandbox_verifier"
    endpoint: "http://aftermath-backend:8000/api/v1/remediations/workflows/{workflow_id}/validate"
    method: "POST"

prompts:
  - id: "remediation_synthesis_prompt"
    system: >
      You are the GitLab Duo Remediation Engineer for AFTERMATH.
      When safety invariant INV-PAY-001 fails during consequence simulation,
      inspect services/payment_worker/processor.py and synthesize an atomic idempotency barrier
      with compound unique constraints or asyncio.Lock deduplication.
      Ensure duplicate retries drop to 0. Do NOT auto-merge without human approval.
