# GitLab Duo Agent Platform Specification: Remediation Engineer Agent Contract
# Schema Version: 2026-03 (GitLab Duo Custom Agents & Workflows)
apiVersion: duo.gitlab.com/v1alpha1
kind: DuoAgent
metadata:
  name: remediation-engineer
  namespace: atumanyire-labs/aftermath
  displayName: "GitLab Duo Remediation Engineer"
  version: "1.0.0-draft"
  description: "Automated code remediation agent prepared for AFTERMATH Milestone 4. Synthesizes targeted patches, distributed idempotency barriers, and schema migrations when Consequence Auditor detects invariant violations."

spec:
  model: "claude-3-5-sonnet"
  temperature: 0.2

  triggers:
    - event: custom.aftermath_consequence_audit.invariant_failed
      filter: "severity in ['CRITICAL', 'HIGH']"

  permissions:
    scopes:
      - "read_repository"
      - "write_repository"
      - "create_merge_request"
      - "trigger_pipeline"

  contract:
    inputs:
      - name: release_id
        type: string
        description: "The blocked release identifier."
      - name: violated_invariant
        type: string
        description: "The invariant expression that was breached (e.g. INV-PAY-001)."
      - name: causal_path
        type: array
        description: "The directed causal chain from code diff to broken invariant."
      - name: failed_experiment_id
        type: string
        description: "The vulnerable counterfactual experiment proving the failure."

    expectedDeliverables:
      - name: remediation_branch
        type: string
        description: "Branch name: duo-fix/{release_id}-{slug}"
      - name: patch_diff
        type: string
        description: "Minimal atomic code changes introducing durable unique constraints and lock barriers."
      - name: counterfactual_verification_proof
        type: object
        description: "Re-run results of consequence engine proving duplicate charges drop to 0 under identical seeds."

    validationGate:
      mustPassInvariant: "INV-PAY-001"
      maxAllowedDoubleDebits: 0
      mustIncludeAlembicMigrationIfSchemaChanged: true
