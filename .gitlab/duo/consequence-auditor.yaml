# ==============================================================================
# GitLab Duo Flow Registry v1 Specification: Consequence Auditor Flow
# Project: atumanyire-labs/aftermath
# ==============================================================================
version: "1.0"

metadata:
  name: "aftermath-consequence-auditor"
  displayName: "GitLab Duo Consequence Auditor"
  description: "DevSecOps agent flow that inspects MR diffs, triggers counterfactual simulations, and asserts safety invariant INV-PAY-001."
  version: "1.2.0"

environment:
  coding_environment: full

triggers:
  - type: mention
  - type: assign
  - type: merge_request.opened
  - type: merge_request.synchronize

components:
  - name: "inspect_diff_and_audit"
    type: AgentComponent
    prompt_id: "consequence_audit_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - "context:goal"

  - name: "execute_consequence_sandbox"
    type: ToolComponent
    tool: "aftermath_consequence_sandbox"
    endpoint: "http://aftermath-backend:8000/api/v1/experiments/run-pair"
    method: "POST"
    inputs:
      - from: "context:release_id"
        as: "release_id"
      - "scenario_id: lost-response-retry"
      - "concurrency: 5"

prompts:
  - id: "consequence_audit_prompt"
    system: >
      You are the GitLab Duo Consequence Auditor for AFTERMATH: The Release Time Machine.
      Analyze the merge request diff between main and the target branch.
      CRITICAL INVARIANT TO ENFORCE:
      ONE LOGICAL PURCHASE MUST NOT PRODUCE MULTIPLE CHARGES (INV-PAY-001).
      If parallel retries or race conditions produce multiple debit transactions in the ledger,
      flag status as CRITICAL FAIL and output the exact blast radius.
